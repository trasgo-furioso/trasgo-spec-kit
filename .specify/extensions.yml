installed:
- trasgospec
settings:
  auto_execute_hooks: true
  gh_integration: true
hooks:
  after_specify:
    - extension: trasgospec
      command: speckit.trasgospec.flow-gate
      description: "GitHub Flow — create/switch to feature branch after spec creation"
      optional: false
      enabled: true
  before_clarify:
    - extension: trasgospec
      command: speckit.trasgospec.flow-gate
      description: "GitHub Flow — require feature branch"
      optional: false
      enabled: true
  before_checklist:
    - extension: trasgospec
      command: speckit.trasgospec.flow-gate
      description: "GitHub Flow — require feature branch"
      optional: false
      enabled: true
  before_plan:
    - extension: trasgospec
      command: speckit.trasgospec.flow-gate
      description: "GitHub Flow — require feature branch"
      optional: false
      enabled: true
  before_tasks:
    - extension: trasgospec
      command: speckit.trasgospec.flow-gate
      description: "GitHub Flow — require feature branch"
      optional: false
      enabled: true
  before_implement:
    - extension: trasgospec
      command: speckit.trasgospec.flow-gate
      description: "GitHub Flow — require feature branch"
      optional: false
      enabled: true
  before_converge:
    - extension: trasgospec
      command: speckit.trasgospec.flow-gate
      description: "GitHub Flow — require feature branch"
      optional: false
      enabled: true
  before_analyze:
    - extension: trasgospec
      command: speckit.trasgospec.flow-gate
      description: "GitHub Flow — require feature branch"
      optional: false
      enabled: true
  after_plan:
    - extension: trasgospec
      command: speckit.trasgospec.flow-nudge
      description: "Suggest opening a draft PR for this feature"
      optional: true
      enabled: true
  after_implement:
    - extension: trasgospec
      command: speckit.trasgospec.flow-nudge
      description: "Suggest marking PR as ready for review"
      optional: true
      enabled: true
  after_analyze:
    - extension: trasgospec
      command: speckit.trasgospec.flow-nudge
      description: "Suggest PR is ready for final review"
      optional: true
      enabled: true
